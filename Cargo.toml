[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/lbAntoine/paper-vcs"
authors = ["lbAntoine <rainreport.dev@proton.me>"]

[workspace.dependencies]
paper-core = { path = "crates/paper-core" }
paper-git = { path = "crates/paper-git" }
paper-diff = { path = "crates/paper-diff" }

assert_cmd = "2"
dunce = "1"
clap = { version = "4.6", features = ["derive"] }
gix = { version = "0.88", default-features = false, features = ["index", "sha1"] }
ignore = "0.4"
insta = { version = "1", features = ["filters", "json"] }
jiff = "0.2"
proptest = "1.12"
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = "2.7"
tempfile = "3.27"
toml_edit = "0.25"
unicode-segmentation = "1.11"
thiserror = "2.0"

# Add third-party deps here when a task first needs them, then use `dep.workspace = true` in the crate.
# Planned: gix 0.88, clap 4.6, thiserror 2, anyhow 1, serde 1, serde_json 1, toml 1, rand 0.10,
#          ignore 0.4, imara-diff 0.2, tempfile 3, assert_cmd 2, insta 1

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
